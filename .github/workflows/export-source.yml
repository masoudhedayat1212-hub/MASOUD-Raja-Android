name: Export Source

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unpack source zip
        run: |
          rm -rf buildsrc
          mkdir -p buildsrc
          unzip -q MASOUD_Android_v1.zip -d buildsrc
          find buildsrc -maxdepth 5 -type f | sort | head -300

      - name: Upload source tree
        uses: actions/upload-artifact@v4
        with:
          name: MASOUD-Raja-Android-SOURCE
          path: buildsrc/MASOUD_Android/**
          if-no-files-found: error
