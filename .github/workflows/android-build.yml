name: Android Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare V8 from Raja login-capable lineage
        shell: bash
        run: |
          set -euo pipefail
          rm -rf buildsrc output
          mkdir -p buildsrc output
          unzip -q MASOUD_Android_v1.zip -d buildsrc
          APP=buildsrc/MASOUD_Android
          MAIN="$APP/app/src/main/java/com/masoud/raja/MainActivity.java"
          base64 -d v5/MainActivity.java.gz.b64 | gzip -d > "$MAIN"
          mkdir -p "$APP/app/src/main/res/drawable" "$APP/app/src/main/res/drawable-nodpi"
          base64 -d v5/train_banner.b64 > "$APP/app/src/main/res/drawable-nodpi/train_banner.jpg"
          cp v5/ic_train.xml "$APP/app/src/main/res/drawable/ic_train.xml"
          python3 v6/patch.py
          base64 -d v8/header_reference.b64 > "$APP/app/src/main/res/drawable-nodpi/header_reference.jpg"
          python3 v8/patch_v8.py

      - name: Verify V8 UI and Raja login logic
        shell: bash
        run: |
          set -euo pipefail
          MAIN=buildsrc/MASOUD_Android/app/src/main/java/com/masoud/raja/MainActivity.java
          test -s buildsrc/MASOUD_Android/app/src/main/res/drawable-nodpi/header_reference.jpg
          grep -q 'private static final String VERSION = "V8"' "$MAIN"
          grep -q 'R.drawable.header_reference' "$MAIN"
          grep -q 'یک طرفه' "$MAIN"
          grep -q 'اکانت رجا' "$MAIN"
          grep -q 'شماره قطار' "$MAIN"
          grep -q 'از قیمت' "$MAIN"
          grep -q 'تا قیمت' "$MAIN"
          grep -q 'تاریخ حرکت' "$MAIN"
          grep -q '1 مسافر' "$MAIN"
          grep -q 'اجرای ربات قطار' "$MAIN"
          grep -q 'private void injectLoginFixed()' "$MAIN"
          grep -q 'injectLoginFixed();' "$MAIN"
          grep -q 'LOGIN_FALLBACK_CLICKED' "$MAIN"
          grep -q 'versionCode 8' buildsrc/MASOUD_Android/app/build.gradle

      - name: Build APK
        shell: bash
        run: |
          set -euo pipefail
          cd buildsrc/MASOUD_Android
          gradle assembleDebug --stacktrace

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          APK=$(find buildsrc/MASOUD_Android/app/build/outputs/apk -type f -name '*.apk' | head -1)
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          sha256sum "$APK"
          cp "$APK" output/MASOUD_Raja_V8.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MASOUD-Raja-V8
          path: output/MASOUD_Raja_V8.apk
          if-no-files-found: error
