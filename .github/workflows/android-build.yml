name: Android Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Unpack project
        run: |
          rm -rf buildsrc
          mkdir -p buildsrc
          unzip -q MASOUD_Android_v1.zip -d buildsrc
          echo "Extracted files:"
          find buildsrc -maxdepth 4 -type f | sort | head -250

      - name: Build APK
        shell: bash
        run: |
          set -e
          PROJECT_DIR=$(dirname "$(find buildsrc -type f -name settings.gradle | head -1)")
          if [ -z "$PROJECT_DIR" ] || [ "$PROJECT_DIR" = "." ]; then
            echo "ERROR: Gradle project root not found"
            exit 2
          fi
          cd "$PROJECT_DIR"
          echo "===== build.gradle ====="
          cat build.gradle || true
          echo "===== app/build.gradle ====="
          cat app/build.gradle || true
          echo "===== gradle.properties ====="
          cat gradle.properties || true

          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew assembleDebug --stacktrace
          elif command -v gradle >/dev/null 2>&1; then
            gradle --version
            gradle assembleDebug --stacktrace
          else
            echo "ERROR: no Gradle wrapper and no system Gradle available"
            exit 3
          fi

      - name: Collect APK
        if: success()
        run: |
          mkdir -p output
          find buildsrc -type f -name '*.apk' -exec cp {} output/ \;
          ls -lah output

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: MASOUD-Raja-Android-APK
          path: output/*.apk
          if-no-files-found: error
