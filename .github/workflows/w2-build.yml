name: W8 Build

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/w2-build.yml'
      - 'w2/MainActivity.java'
      - 'w2/header_parts_v2/**'
      - 'w2/icon_w7_parts/**'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare W8 from W4 verified reference
        shell: bash
        run: |
          set -euo pipefail
          rm -rf buildsrc output
          unzip -q MASOUD_Android_v1.zip -d buildsrc
          APP=buildsrc/MASOUD_Android
          MAIN="$APP/app/src/main/java/com/masoud/raja/MainActivity.java"
          cp w2/MainActivity.java "$MAIN"

          sed -i 's/import android.app.Ringtone;/import android.media.Ringtone;/' "$MAIN"
          sed -i 's/import android.app.RingtoneManager;/import android.media.RingtoneManager;/' "$MAIN"

          mkdir -p "$APP/app/src/main/res/drawable-nodpi"
          python3 - <<'PY'
          import base64
          from pathlib import Path
          source = ''.join(p.read_text(encoding='utf-8') for p in sorted(Path('w2/header_parts_v2').glob('part_*.b64')))
          clean = ''.join(ch for ch in source if ch.isalnum() or ch in '+/=')
          clean += '=' * (-len(clean) % 4)
          image = base64.b64decode(clean, validate=False)
          if image[:3] != bytes((255, 216, 255)):
              raise SystemExit('Invalid JPEG header')
          Path('buildsrc/MASOUD_Android/app/src/main/res/drawable-nodpi/w2_header_reference.jpg').write_bytes(image)
          PY
          test -s "$APP/app/src/main/res/drawable-nodpi/w2_header_reference.jpg"
          file "$APP/app/src/main/res/drawable-nodpi/w2_header_reference.jpg"
          python3 - <<'PY'
          import base64
          from pathlib import Path
          source = ''.join(p.read_text(encoding='utf-8') for p in sorted(Path('w2/icon_w7_parts').glob('part_*.b64')))
          clean = ''.join(ch for ch in source if ch.isalnum() or ch in '+/=')
          clean += '=' * (-len(clean) % 4)
          image = base64.b64decode(clean, validate=False)
          if image[:3] != bytes((255, 216, 255)):
              raise SystemExit('Invalid W8 icon JPEG')
          Path('buildsrc/MASOUD_Android/app/src/main/res/drawable-nodpi/w8_train_icon_source.jpg').write_bytes(image)
          PY
          test -s "$APP/app/src/main/res/drawable-nodpi/w8_train_icon_source.jpg"
          file "$APP/app/src/main/res/drawable-nodpi/w8_train_icon_source.jpg"
          python3 -m pip install --quiet pillow
          python3 - <<'PY'
          from PIL import Image, ImageOps
          from pathlib import Path
          src=Image.open('buildsrc/MASOUD_Android/app/src/main/res/drawable-nodpi/w8_train_icon_source.jpg').convert('RGB')
          icon=ImageOps.fit(src,(512,512),method=Image.Resampling.LANCZOS,centering=(0.43,0.5))
          icon.save('buildsrc/MASOUD_Android/app/src/main/res/drawable-nodpi/w8_train_icon.png',optimize=True)
          PY
          test -s "$APP/app/src/main/res/drawable-nodpi/w8_train_icon.png"
          python3 - <<'PY'
          import re
          from pathlib import Path
          p=Path('buildsrc/MASOUD_Android/app/src/main/AndroidManifest.xml')
          t=p.read_text(encoding='utf-8')
          t=re.sub(r'\s+android:icon="[^"]*"','',t)
          t=re.sub(r'\s+android:roundIcon="[^"]*"','',t)
          t=t.replace('<application','<application android:icon="@drawable/w8_train_icon" android:roundIcon="@drawable/w8_train_icon"',1)
          p.write_text(t,encoding='utf-8')
          PY
          grep -q 'android:icon="@drawable/w8_train_icon"' "$APP/app/src/main/AndroidManifest.xml"
          grep -q 'android:roundIcon="@drawable/w8_train_icon"' "$APP/app/src/main/AndroidManifest.xml"

          python3 - <<'PY'
          from pathlib import Path
          p=Path('buildsrc/MASOUD_Android/app/build.gradle')
          t=p.read_text(encoding='utf-8')
          t=t.replace("applicationId 'com.masoud.raja'","applicationId 'com.masoud.raja.w2real'")
          t=t.replace('applicationId "com.masoud.raja"','applicationId "com.masoud.raja.w2real"')
          t=t.replace('versionCode 1','versionCode 38')
          t=t.replace("versionName '1.0.0'","versionName 'W8'")
          t=t.replace('versionName "1.0.0"','versionName "W8"')
          p.write_text(t,encoding='utf-8')
          PY

      - name: Verify approved changes only
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'R.drawable.w2_header_reference' w2/MainActivity.java
          ! grep -q 'MASOUD Raja Bot' w2/MainActivity.java
          ! grep -q 'tabPassengers' w2/MainActivity.java
          grep -q 'showPassengerDialog()' w2/MainActivity.java
          grep -q 'version.setText("W8")' w2/MainActivity.java
          ! grep -q 'نوزاد' w2/MainActivity.java
          grep -q 'jalaliToGregorian' w2/MainActivity.java
          grep -q 'DAY_OF_WEEK)%7' w2/MainActivity.java
          grep -q "تعداد بزرگسال و کودک در رجا تنظیم شد" w2/MainActivity.java
          grep -q 'enablePriceFormatting' w2/MainActivity.java
          grep -q 'loginMissing' w2/MainActivity.java
          grep -q 'setDropDownBackgroundDrawable' w2/MainActivity.java
          grep -q 'new WebView(this)' w2/MainActivity.java
          grep -q 'injectLogin()' w2/MainActivity.java
          grep -q 'injectSearchForm()' w2/MainActivity.java
          grep -q 'inspectResultsAndReserve()' w2/MainActivity.java

      - name: Build APK
        shell: bash
        run: |
          set -euo pipefail
          cd buildsrc/MASOUD_Android
          gradle assembleDebug --stacktrace

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          APK=$(find buildsrc/MASOUD_Android/app/build/outputs/apk -type f -name '*.apk' | head -1)
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          mkdir -p "$GITHUB_WORKSPACE/output"
          cp "$APK" "$GITHUB_WORKSPACE/output/w8.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: w8
          path: output/w8.apk
          if-no-files-found: error
