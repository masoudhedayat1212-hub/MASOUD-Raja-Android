name: Android Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare V6
        shell: bash
        run: |
          set -euo pipefail
          rm -rf buildsrc
          mkdir -p buildsrc
          unzip -q MASOUD_Android_v1.zip -d buildsrc
          APP=buildsrc/MASOUD_Android
          MAIN="$APP/app/src/main/java/com/masoud/raja/MainActivity.java"
          base64 -d v5/MainActivity.java.gz.b64 | gzip -d > "$MAIN"
          mkdir -p "$APP/app/src/main/res/drawable-nodpi" "$APP/app/src/main/res/drawable"
          base64 -d v5/train_banner.b64 > "$APP/app/src/main/res/drawable-nodpi/train_banner.jpg"
          cp v5/ic_train.xml "$APP/app/src/main/res/drawable/ic_train.xml"
          python3 v6/patch.py
      - name: Verify V6
        shell: bash
        run: |
          set -euo pipefail
          MAIN=buildsrc/MASOUD_Android/app/src/main/java/com/masoud/raja/MainActivity.java
          grep -q 'private static final String VERSION = "V6"' "$MAIN"
          grep -q 'private void injectLoginFixed()' "$MAIN"
          grep -q 'LOGIN_FALLBACK_CLICKED' "$MAIN"
          grep -q 'injectLoginFixed();' "$MAIN"
          grep -q 'تاریخ رفت واقعاً ثبت شد' "$MAIN"
          grep -q 'versionCode 6' buildsrc/MASOUD_Android/app/build.gradle
      - name: Build APK
        shell: bash
        run: |
          set -euo pipefail
          cd buildsrc/MASOUD_Android
          gradle assembleDebug --stacktrace
      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          APK=$(find buildsrc/MASOUD_Android/app/build/outputs/apk -type f -name '*.apk' | head -1)
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          sha256sum "$APK"
          mkdir -p "$GITHUB_WORKSPACE/output"
          cp "$APK" "$GITHUB_WORKSPACE/output/MASOUD_Raja_Android_V6.apk"
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MASOUD-Raja-Android-V6-APK
          path: output/MASOUD_Raja_Android_V6.apk
          if-no-files-found: error
