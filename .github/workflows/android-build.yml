name: Android Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare V3 reference theme build
        shell: bash
        run: |
          set -euo pipefail
          rm -rf buildsrc output
          mkdir -p buildsrc output
          unzip -q MASOUD_Android_v1.zip -d buildsrc
          APP=buildsrc/MASOUD_Android
          MAIN="$APP/app/src/main/java/com/masoud/raja/MainActivity.java"
          mkdir -p "$APP/app/src/main/res/drawable-nodpi"
          cp v3/MainActivity.java "$MAIN"
          python3 - <<'PY'
          from pathlib import Path
          import base64,re
          s=Path('v3/header_reference.b64').read_text(encoding='utf-8')
          s=re.sub(r'[^A-Za-z0-9+/=]','',s)
          s += '='*((4-len(s)%4)%4)
          Path('buildsrc/MASOUD_Android/app/src/main/res/drawable-nodpi/header_reference_v3.jpg').write_bytes(base64.b64decode(s))
          g=Path('buildsrc/MASOUD_Android/app/build.gradle')
          t=g.read_text(encoding='utf-8')
          t=re.sub(r"applicationId\\s+['\"][^'\"]+['\"]","applicationId 'com.masoud.raja.v3ref'",t)
          t=re.sub(r'versionCode\s+\d+','versionCode 9',t)
          t=re.sub(r"versionName\\s+['\"][^'\"]+['\"]","versionName '3.0-ref'",t)
          g.write_text(t,encoding='utf-8')
          PY
          python3 v3/reference_theme_patch.py

      - name: Verify V3 reference UI and logic
        shell: bash
        run: |
          set -euo pipefail
          MAIN=buildsrc/MASOUD_Android/app/src/main/java/com/masoud/raja/MainActivity.java
          test -s buildsrc/MASOUD_Android/app/src/main/res/drawable-nodpi/header_reference_v3.jpg
          file buildsrc/MASOUD_Android/app/src/main/res/drawable-nodpi/header_reference_v3.jpg | grep -q 'JPEG image data'
          grep -q 'R.drawable.header_reference_v3' "$MAIN"
          grep -q 'یک طرفه' "$MAIN"
          grep -q 'اکانت رجا' "$MAIN"
          grep -q 'اجرای ربات قطار' "$MAIN"
          grep -q 'private void startBot()' "$MAIN"
          python3 - <<'PY'
          from pathlib import Path
          t=Path('buildsrc/MASOUD_Android/app/build.gradle').read_text(encoding='utf-8')
          assert "applicationId 'com.masoud.raja.v3ref'" in t
          assert 'versionCode 9' in t
          PY

      - name: Build APK
        shell: bash
        run: |
          set -euo pipefail
          cd buildsrc/MASOUD_Android
          gradle assembleDebug --stacktrace

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          APK=$(find buildsrc/MASOUD_Android/app/build/outputs/apk -type f -name '*.apk' | head -1)
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          sha256sum "$APK"
          mkdir -p "$GITHUB_WORKSPACE/output"
          cp "$APK" "$GITHUB_WORKSPACE/output/MASOUD_Raja_V3_REFERENCE_THEME_INSTALLABLE.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MASOUD-Raja-V3-REFERENCE-THEME-INSTALLABLE
          path: output/MASOUD_Raja_V3_REFERENCE_THEME_INSTALLABLE.apk
          if-no-files-found: error
