name: V3 From V1 Header

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/v3-v1-header.yml'
      - 'v3_from_v1/header_parts/**'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare V3 from untouched V1
        shell: bash
        run: |
          set -euo pipefail
          rm -rf buildsrc output
          mkdir -p buildsrc output
          unzip -q MASOUD_Android_v1.zip -d buildsrc
          APP=buildsrc/MASOUD_Android
          MAIN="$APP/app/src/main/java/com/masoud/raja/MainActivity.java"
          cp "$MAIN" /tmp/MainActivity.original

          mkdir -p "$APP/app/src/main/res/drawable-nodpi"
          cat v3_from_v1/header_parts/part00.b64 \
              v3_from_v1/header_parts/part10000.b64 \
              v3_from_v1/header_parts/part20000.b64 \
              v3_from_v1/header_parts/part30000.b64 \
              v3_from_v1/header_parts/part40000.b64 \
              v3_from_v1/header_parts/part50000.b64 \
              v3_from_v1/header_parts/part60000.b64 \
              | base64 -d > "$APP/app/src/main/res/drawable-nodpi/v3_header.jpg"

          echo "409279e77c0a0788a331b97ce06891eea75dbaa8d069aa04864142d56cca86ef  $APP/app/src/main/res/drawable-nodpi/v3_header.jpg" | sha256sum -c -

          python3 - <<'PY'
          from pathlib import Path

          p = Path('buildsrc/MASOUD_Android/app/src/main/java/com/masoud/raja/MainActivity.java')
          t = p.read_text(encoding='utf-8')

          needle = '        LinearLayout root = new LinearLayout(this); root.setOrientation(LinearLayout.VERTICAL); root.setBackgroundColor(BG);'
          assert t.count(needle) == 1
          hero = needle + """
          \n        ImageView hero = new ImageView(this);
                  hero.setImageResource(R.drawable.v3_header);
                  hero.setAdjustViewBounds(true);
                  hero.setScaleType(ImageView.ScaleType.FIT_CENTER);
                  root.addView(hero,new LinearLayout.LayoutParams(-1,-2));"""
          t = t.replace(needle, hero, 1)

          old = 'title.setText("MASOUD — ربات رجا")'
          new = 'title.setText("MASOUD — ربات رجا • V3")'
          assert t.count(old) == 1
          t = t.replace(old, new, 1)
          p.write_text(t, encoding='utf-8')

          g = Path('buildsrc/MASOUD_Android/app/build.gradle')
          s = g.read_text(encoding='utf-8')
          assert "applicationId 'com.masoud.raja'" in s
          assert 'versionCode 1' in s
          assert "versionName '1.0.0'" in s
          s = s.replace('versionCode 1', 'versionCode 3', 1)
          s = s.replace("versionName '1.0.0'", "versionName 'V3'", 1)
          g.write_text(s, encoding='utf-8')
          PY

      - name: Verify only approved changes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          original = Path('/tmp/MainActivity.original').read_text(encoding='utf-8')
          patched = Path('buildsrc/MASOUD_Android/app/src/main/java/com/masoud/raja/MainActivity.java').read_text(encoding='utf-8')

          hero = """
          \n        ImageView hero = new ImageView(this);
                  hero.setImageResource(R.drawable.v3_header);
                  hero.setAdjustViewBounds(true);
                  hero.setScaleType(ImageView.ScaleType.FIT_CENTER);
                  root.addView(hero,new LinearLayout.LayoutParams(-1,-2));"""
          restored = patched.replace(hero, '', 1).replace(
              'title.setText("MASOUD — ربات رجا • V3")',
              'title.setText("MASOUD — ربات رجا")',
              1
          )
          assert restored == original, 'Unexpected MainActivity changes'
          assert patched.count('R.drawable.v3_header') == 1
          assert patched.count('• V3') == 1

          s = Path('buildsrc/MASOUD_Android/app/build.gradle').read_text(encoding='utf-8')
          assert "applicationId 'com.masoud.raja'" in s
          assert 'versionCode 3' in s
          assert "versionName 'V3'" in s
          PY

          test -s buildsrc/MASOUD_Android/app/src/main/res/drawable-nodpi/v3_header.jpg
          file buildsrc/MASOUD_Android/app/src/main/res/drawable-nodpi/v3_header.jpg | grep -q 'JPEG image data'

      - name: Build APK
        shell: bash
        run: |
          set -euo pipefail
          cd buildsrc/MASOUD_Android
          gradle assembleDebug --stacktrace

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          APK=$(find buildsrc/MASOUD_Android/app/build/outputs/apk -type f -name '*.apk' | head -1)
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          mkdir -p output
          cp "$APK" output/MASOUD_Raja_V3.apk
          sha256sum output/MASOUD_Raja_V3.apk

      - uses: actions/upload-artifact@v4
        with:
          name: MASOUD-Raja-V3
          path: output/MASOUD_Raja_V3.apk
          if-no-files-found: error
