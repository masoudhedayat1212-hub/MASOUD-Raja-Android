name: Android Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Unpack project
        run: |
          rm -rf buildsrc
          mkdir -p buildsrc
          unzip -q MASOUD_Android_v2.zip -d buildsrc
          echo "Using MASOUD Android V2 source"
          find buildsrc -maxdepth 4 -type f | sort | head -250

      - name: Build APK
        shell: bash
        run: |
          set -e
          cd buildsrc
          gradle --version
          gradle assembleDebug --stacktrace

      - name: Verify APK
        run: |
          APK=$(find buildsrc -type f -name '*.apk' | head -1)
          test -n "$APK"
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          ls -lh "$APK"
          sha256sum "$APK"

      - name: Collect APK
        run: |
          mkdir -p output
          APK=$(find buildsrc -type f -name '*.apk' | head -1)
          cp "$APK" output/MASOUD_Raja_Android_V2.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MASOUD-Raja-Android-V2-APK
          path: output/MASOUD_Raja_Android_V2.apk
          if-no-files-found: error
