name: W2 Build

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/w2-build.yml'
      - 'w2/MainActivity.java'
      - 'w2/header_reference.b64'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare W2 from V3 reference
        shell: bash
        run: |
          set -euo pipefail
          rm -rf buildsrc output
          unzip -q MASOUD_Android_v1.zip -d buildsrc
          APP=buildsrc/MASOUD_Android
          MAIN="$APP/app/src/main/java/com/masoud/raja/MainActivity.java"
          cp w2/MainActivity.java "$MAIN"

          sed -i 's/import android.app.Ringtone;/import android.media.Ringtone;/' "$MAIN"
          sed -i 's/import android.app.RingtoneManager;/import android.media.RingtoneManager;/' "$MAIN"

          mkdir -p "$APP/app/src/main/res/drawable-nodpi"
          python3 - <<'PY'
          import base64
          from pathlib import Path
          source = Path('w2/header_reference.b64').read_text(encoding='utf-8')
          clean = ''.join(ch for ch in source if ch.isalnum() or ch in '+/=')
          clean += '=' * (-len(clean) % 4)
          image = base64.b64decode(clean, validate=False)
          if not image.startswith(b'\\xff\\xd8\\xff'):
              raise SystemExit('Invalid JPEG header')
          Path('buildsrc/MASOUD_Android/app/src/main/res/drawable-nodpi/w2_header_reference.jpg').write_bytes(image)
          PY
          test -s "$APP/app/src/main/res/drawable-nodpi/w2_header_reference.jpg"
          file "$APP/app/src/main/res/drawable-nodpi/w2_header_reference.jpg"

          python3 - <<'PY'
          from pathlib import Path
          p=Path('buildsrc/MASOUD_Android/app/build.gradle')
          t=p.read_text(encoding='utf-8')
          t=t.replace("applicationId 'com.masoud.raja'","applicationId 'com.masoud.raja.w2real'")
          t=t.replace('applicationId "com.masoud.raja"','applicationId "com.masoud.raja.w2real"')
          t=t.replace('versionCode 1','versionCode 32')
          t=t.replace("versionName '1.0.0'","versionName 'W2'")
          t=t.replace('versionName "1.0.0"','versionName "W2"')
          p.write_text(t,encoding='utf-8')
          PY

      - name: Verify approved changes only
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'R.drawable.w2_header_reference' w2/MainActivity.java
          ! grep -q 'MASOUD Raja Bot' w2/MainActivity.java
          ! grep -q 'tabPassengers' w2/MainActivity.java
          grep -q 'section("تعداد مسافر")' w2/MainActivity.java
          grep -q 'new WebView(this)' w2/MainActivity.java
          grep -q 'injectLogin()' w2/MainActivity.java
          grep -q 'injectSearchForm()' w2/MainActivity.java
          grep -q 'inspectResultsAndReserve()' w2/MainActivity.java

      - name: Build APK
        shell: bash
        run: |
          set -euo pipefail
          cd buildsrc/MASOUD_Android
          gradle assembleDebug --stacktrace

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          APK=$(find buildsrc/MASOUD_Android/app/build/outputs/apk -type f -name '*.apk' | head -1)
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          mkdir -p "$GITHUB_WORKSPACE/output"
          cp "$APK" "$GITHUB_WORKSPACE/output/w2.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: w2
          path: output/w2.apk
          if-no-files-found: error
