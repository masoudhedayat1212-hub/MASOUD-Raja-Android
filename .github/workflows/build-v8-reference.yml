name: Build V8 Reference UI
on:
  push:
    paths:
      - '.github/workflows/build-v8-reference.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare V8 from V1
        shell: bash
        run: |
          set -euo pipefail
          rm -rf buildsrc output
          mkdir -p buildsrc output
          unzip -q MASOUD_Android_v1.zip -d buildsrc
          APP=buildsrc/MASOUD_Android
          MAIN="$APP/app/src/main/java/com/masoud/raja/MainActivity.java"
          mkdir -p "$APP/app/src/main/res/drawable"
          cp v5/ic_train.xml "$APP/app/src/main/res/drawable/ic_train.xml"
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('buildsrc/MASOUD_Android/app/src/main/java/com/masoud/raja/MainActivity.java')
          s=p.read_text(encoding='utf-8')
          if 'import android.graphics.drawable.GradientDrawable;' not in s:
              s=s.replace('import android.graphics.Color;','import android.graphics.Color;\nimport android.graphics.drawable.GradientDrawable;')

          s=s.replace('private static final int BG = Color.rgb(7,16,24);','private static final int BG = Color.rgb(246,249,252);')
          s=s.replace('private static final int PANEL = Color.rgb(11,21,30);','private static final int PANEL = Color.rgb(255,255,255);')
          s=s.replace('private static final int FIELD = Color.rgb(10,20,28);','private static final int FIELD = Color.rgb(255,255,255);')
          s=s.replace('private static final int TEXT = Color.rgb(244,247,251);','private static final int TEXT = Color.rgb(35,48,63);')
          s=s.replace('private static final int MUTED = Color.rgb(154,171,186);','private static final int MUTED = Color.rgb(129,143,158);')
          s=s.replace('private static final int BLUE = Color.rgb(13,125,245);','private static final int BLUE = Color.rgb(21,104,190);')
          s=s.replace('private static final int GREEN = Color.rgb(0,200,83);','private static final int GREEN = Color.rgb(255,190,0);')

          def replace_method(src, signature, new_method):
              start=src.index(signature)
              brace=src.index('{', start)
              depth=0
              end=None
              for i in range(brace, len(src)):
                  if src[i]=='{': depth+=1
                  elif src[i]=='}':
                      depth-=1
                      if depth==0:
                          end=i+1
                          break
              if end is None: raise RuntimeError(signature)
              return src[:start]+new_method+src[end:]

          dp_sig='    private int dp(int value)'
          dp_start=s.index(dp_sig)
          dp_end=s.index('\n', s.index('}', dp_start))+1
          helper='''    private int dp(int value) { return (int)(value * getResources().getDisplayMetrics().density + 0.5f); }\n\n    private GradientDrawable rounded(int color, int strokeColor, int radius) {\n        GradientDrawable g=new GradientDrawable(); g.setColor(color); g.setCornerRadius(dp(radius));\n        if(strokeColor!=Color.TRANSPARENT) g.setStroke(dp(1),strokeColor); return g;\n    }\n\n    private LinearLayout card(String labelText, View child) {\n        LinearLayout c=new LinearLayout(this); c.setOrientation(LinearLayout.VERTICAL); c.setPadding(dp(14),dp(9),dp(14),dp(9));\n        c.setBackground(rounded(Color.WHITE,Color.rgb(216,224,232),12));\n        if(labelText!=null && !labelText.isEmpty()){ TextView l=label(labelText); l.setTextColor(MUTED); l.setTextSize(12); c.addView(l,new LinearLayout.LayoutParams(-1,dp(20))); }\n        c.addView(child,new LinearLayout.LayoutParams(-1,dp(42))); return c;\n    }\n'''
          s=s[:dp_start]+helper+s[dp_end:]

          s=replace_method(s,'    private TextView label(String text)', '''    private TextView label(String text) {\n        TextView v=new TextView(this); v.setText(text); v.setTextColor(TEXT); v.setTextSize(14); v.setGravity(Gravity.RIGHT|Gravity.CENTER_VERTICAL); v.setPadding(0,0,0,0); return v;\n    }''')
          s=replace_method(s,'    private EditText field(String hint)', '''    private EditText field(String hint) {\n        EditText e=new EditText(this); e.setHint(hint); e.setHintTextColor(MUTED); e.setTextColor(TEXT); e.setTextSize(16); e.setSingleLine(true);\n        e.setGravity(Gravity.RIGHT|Gravity.CENTER_VERTICAL); e.setBackgroundColor(Color.TRANSPARENT); e.setPadding(0,0,0,0); e.setLayoutParams(new LinearLayout.LayoutParams(-1,dp(42))); return e;\n    }''')
          s=replace_method(s,'    private Button button(String text, int color)', '''    private Button button(String text, int color) {\n        Button b=new Button(this); b.setText(text); b.setTextColor(color==GREEN?Color.rgb(38,47,57):Color.WHITE); b.setTextSize(16); b.setAllCaps(false);\n        b.setBackground(rounded(color,Color.TRANSPARENT,12)); b.setMinHeight(dp(50)); return b;\n    }''')
          s=replace_method(s,'    private LinearLayout section(String title)', '''    private LinearLayout section(String title) {\n        LinearLayout box=new LinearLayout(this); box.setOrientation(LinearLayout.VERTICAL); box.setPadding(dp(14),dp(12),dp(14),dp(14)); box.setBackground(rounded(Color.WHITE,Color.rgb(216,224,232),12));\n        TextView t=label(title); t.setTextSize(16); t.setTypeface(null,1); box.addView(t,new LinearLayout.LayoutParams(-1,-2)); return box;\n    }''')

          s=replace_method(s,'    private void buildUi()', '''    private void buildUi() {\n        LinearLayout root=new LinearLayout(this); root.setOrientation(LinearLayout.VERTICAL); root.setBackgroundColor(BG); root.setLayoutDirection(View.LAYOUT_DIRECTION_RTL);\n\n        LinearLayout header=new LinearLayout(this); header.setOrientation(LinearLayout.HORIZONTAL); header.setGravity(Gravity.CENTER_VERTICAL); header.setPadding(dp(16),dp(10),dp(16),dp(10)); header.setBackground(rounded(BLUE,Color.TRANSPARENT,0));\n        ImageView train=new ImageView(this); train.setImageResource(R.drawable.ic_train); train.setColorFilter(Color.WHITE); train.setPadding(dp(6),dp(6),dp(6),dp(6));\n        LinearLayout titles=new LinearLayout(this); titles.setOrientation(LinearLayout.VERTICAL); titles.setGravity(Gravity.RIGHT|Gravity.CENTER_VERTICAL);\n        TextView title=label("MASOUD Raja Bot   V8"); title.setTextColor(Color.WHITE); title.setTextSize(20); title.setTypeface(null,1);\n        TextView sub=label("سفر آسان‌تر، با رجا"); sub.setTextColor(Color.rgb(224,237,250)); sub.setTextSize(13);\n        titles.addView(title,new LinearLayout.LayoutParams(-1,dp(30))); titles.addView(sub,new LinearLayout.LayoutParams(-1,dp(24)));\n        header.addView(titles,new LinearLayout.LayoutParams(0,dp(62),1)); header.addView(train,new LinearLayout.LayoutParams(dp(84),dp(62))); root.addView(header,new LinearLayout.LayoutParams(-1,dp(82)));\n\n        LinearLayout tabs=new LinearLayout(this); tabs.setOrientation(LinearLayout.HORIZONTAL); tabs.setPadding(dp(14),dp(8),dp(14),dp(8)); tabs.setBackgroundColor(Color.WHITE);\n        Button tabRun=button("یک طرفه",BLUE), tabPassengers=button("مسافران",Color.rgb(118,135,151)), tabBrowser=button("اکانت رجا",Color.rgb(118,135,151));\n        tabs.addView(tabRun,new LinearLayout.LayoutParams(0,dp(44),1)); tabs.addView(tabPassengers,new LinearLayout.LayoutParams(0,dp(44),1)); tabs.addView(tabBrowser,new LinearLayout.LayoutParams(0,dp(44),1)); root.addView(tabs,new LinearLayout.LayoutParams(-1,dp(60)));\n\n        FrameLayout body=new FrameLayout(this); root.addView(body,new LinearLayout.LayoutParams(-1,0,1));\n        runPanel=makeRunPanel(); passengerPanel=makePassengerPanel(); browserPanel=makeBrowserPanel(); body.addView(runPanel); body.addView(passengerPanel); body.addView(browserPanel);\n        tabRun.setOnClickListener(v->showPanel(runPanel)); tabPassengers.setOnClickListener(v->showPanel(passengerPanel)); tabBrowser.setOnClickListener(v->showPanel(browserPanel)); setContentView(root);\n    }''')

          s=replace_method(s,'    private LinearLayout makeRunPanel()', '''    private LinearLayout makeRunPanel(){\n        ScrollView scroll=new ScrollView(this); LinearLayout p=new LinearLayout(this); p.setOrientation(LinearLayout.VERTICAL); p.setPadding(dp(16),dp(14),dp(16),dp(24)); p.setLayoutDirection(View.LAYOUT_DIRECTION_RTL); scroll.addView(p);\n\n        phone=field("شماره موبایل حساب رجا"); phone.setInputType(InputType.TYPE_CLASS_PHONE); p.addView(card("اکانت رجا",phone),new LinearLayout.LayoutParams(-1,dp(76))); gap(p,8);\n        password=field("رمز عبور"); password.setInputType(InputType.TYPE_CLASS_TEXT|InputType.TYPE_TEXT_VARIATION_PASSWORD); p.addView(card("",password),new LinearLayout.LayoutParams(-1,dp(62))); gap(p,12);\n\n        LinearLayout stations=new LinearLayout(this); stations.setOrientation(LinearLayout.VERTICAL); stations.setBackground(rounded(Color.WHITE,Color.rgb(216,224,232),12)); stations.setPadding(dp(14),dp(4),dp(14),dp(4));\n        origin=field("مبدا"); destination=field("مقصد"); stations.addView(origin,new LinearLayout.LayoutParams(-1,dp(48))); View line=new View(this); line.setBackgroundColor(Color.rgb(222,228,234)); stations.addView(line,new LinearLayout.LayoutParams(-1,dp(1))); stations.addView(destination,new LinearLayout.LayoutParams(-1,dp(48))); p.addView(stations,new LinearLayout.LayoutParams(-1,dp(105))); gap(p,12);\n\n        trainNumber=field("شماره قطار"); trainNumber.setInputType(InputType.TYPE_CLASS_NUMBER); p.addView(card("شماره قطار",trainNumber),new LinearLayout.LayoutParams(-1,dp(76))); gap(p,12);\n\n        priceMode=new CheckBox(this); priceMode.setText(""); priceMode.setButtonTintList(android.content.res.ColorStateList.valueOf(BLUE)); priceMode.setLayoutDirection(View.LAYOUT_DIRECTION_LTR); LinearLayout tickRow=new LinearLayout(this); tickRow.setGravity(Gravity.LEFT|Gravity.CENTER_VERTICAL); tickRow.addView(priceMode,new LinearLayout.LayoutParams(dp(48),dp(42))); p.addView(tickRow,new LinearLayout.LayoutParams(-1,dp(42)));\n        LinearLayout prices=new LinearLayout(this); prices.setOrientation(LinearLayout.HORIZONTAL); prices.setLayoutDirection(View.LAYOUT_DIRECTION_RTL); minPrice=field("از قیمت"); maxPrice=field("تا قیمت"); minPrice.setInputType(InputType.TYPE_CLASS_NUMBER); maxPrice.setInputType(InputType.TYPE_CLASS_NUMBER); prices.addView(card("از قیمت",minPrice),new LinearLayout.LayoutParams(0,dp(76),1)); Space sp=new Space(this); prices.addView(sp,new LinearLayout.LayoutParams(dp(10),1)); prices.addView(card("تا قیمت",maxPrice),new LinearLayout.LayoutParams(0,dp(76),1)); p.addView(prices,new LinearLayout.LayoutParams(-1,dp(76))); gap(p,12);\n\n        travelDate=field("تاریخ رفت"); p.addView(card("تاریخ رفت",travelDate),new LinearLayout.LayoutParams(-1,dp(76))); gap(p,12);\n        adults=field("تعداد مسافر"); adults.setInputType(InputType.TYPE_CLASS_NUMBER); adults.setText("1"); p.addView(card("مسافران",adults),new LinearLayout.LayoutParams(-1,dp(76))); gap(p,18);\n\n        children=field("0"); children.setInputType(InputType.TYPE_CLASS_NUMBER); children.setText("0"); children.setVisibility(View.GONE); p.addView(children,new LinearLayout.LayoutParams(1,1));\n        coupe=new CheckBox(this); coupe.setChecked(false); coupe.setVisibility(View.GONE); p.addView(coupe,new LinearLayout.LayoutParams(1,1));\n        alarm=new CheckBox(this); alarm.setChecked(true); alarm.setVisibility(View.GONE); p.addView(alarm,new LinearLayout.LayoutParams(1,1));\n        refresh=field("2"); refresh.setInputType(InputType.TYPE_CLASS_NUMBER|InputType.TYPE_NUMBER_FLAG_DECIMAL); refresh.setText("2"); refresh.setVisibility(View.GONE); p.addView(refresh,new LinearLayout.LayoutParams(1,1));\n        passengerCountLabel=label("مسافر ذخیره‌شده: 0"); passengerCountLabel.setVisibility(View.GONE); p.addView(passengerCountLabel,new LinearLayout.LayoutParams(1,1));\n\n        startBtn=button("اجرای ربات قطار",GREEN); stopBtn=button("توقف",RED); stopBtn.setEnabled(false); stopBtn.setVisibility(View.GONE); p.addView(startBtn,new LinearLayout.LayoutParams(-1,dp(58))); p.addView(stopBtn,new LinearLayout.LayoutParams(-1,dp(1)));\n        status=label("● آماده"); status.setVisibility(View.GONE); p.addView(status,new LinearLayout.LayoutParams(1,1)); logView=new TextView(this); logView.setVisibility(View.GONE); p.addView(logView,new LinearLayout.LayoutParams(1,1));\n\n        startBtn.setOnClickListener(v->startBot()); stopBtn.setOnClickListener(v->stopBot("توقف توسط کاربر"));\n        priceMode.setOnCheckedChangeListener((b,checked)->{ trainNumber.setEnabled(!checked); minPrice.setEnabled(checked); maxPrice.setEnabled(checked); }); minPrice.setEnabled(false); maxPrice.setEnabled(false);\n        LinearLayout container=new LinearLayout(this); container.setOrientation(LinearLayout.VERTICAL); container.addView(scroll,new LinearLayout.LayoutParams(-1,-1)); return container;\n    }''')

          p.write_text(s,encoding='utf-8')

          app=Path('buildsrc/MASOUD_Android')
          manifest=app/'app/src/main/AndroidManifest.xml'
          m=manifest.read_text(encoding='utf-8').replace('android:label="MASOUD"','android:label="MASOUD Raja Bot V8"')
          if 'android:icon=' not in m: m=m.replace('<application ','<application android:icon="@drawable/ic_train" android:roundIcon="@drawable/ic_train" ',1)
          manifest.write_text(m,encoding='utf-8')
          gradle=app/'app/build.gradle'; g=gradle.read_text(encoding='utf-8'); g=re.sub(r'versionCode\s+\d+','versionCode 8',g); g=re.sub(r"versionName\s+'[^']+'","versionName '8.0.0'",g); gradle.write_text(g,encoding='utf-8')
          PY
      - name: Verify V8 source
        run: |
          MAIN=buildsrc/MASOUD_Android/app/src/main/java/com/masoud/raja/MainActivity.java
          grep -q 'MASOUD Raja Bot   V8' "$MAIN"
          grep -q 'اجرای ربات قطار' "$MAIN"
          grep -q 'شماره قطار' "$MAIN"
          grep -q 'از قیمت' "$MAIN"
          grep -q 'تا قیمت' "$MAIN"
          grep -q 'injectLogin' "$MAIN"
          grep -q 'injectSearchForm' "$MAIN"
          grep -q 'inspectResultsAndReserve' "$MAIN"
      - name: Build APK
        run: |
          cd buildsrc/MASOUD_Android
          gradle assembleDebug --stacktrace
      - name: Verify and collect APK
        run: |
          APK=$(find buildsrc/MASOUD_Android/app/build/outputs/apk -type f -name '*.apk' | head -1)
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          cp "$APK" output/MASOUD_Raja_V8_Reference_UI.apk
          sha256sum output/MASOUD_Raja_V8_Reference_UI.apk
      - uses: actions/upload-artifact@v4
        with:
          name: MASOUD-Raja-V8-Reference-APK
          path: output/MASOUD_Raja_V8_Reference_UI.apk
          if-no-files-found: error
