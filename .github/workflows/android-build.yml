name: Android Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Unpack original project
        run: |
          rm -rf buildsrc
          mkdir -p buildsrc
          unzip -q MASOUD_Android_v1.zip -d buildsrc
          test -f buildsrc/MASOUD_Android/app/src/main/java/com/masoud/raja/MainActivity.java

      - name: Apply V2 changes
        shell: bash
        run: |
          cd buildsrc/MASOUD_Android
          cat > /tmp/patch_v2.py <<'PYCODE'
          from pathlib import Path
          import re
          p=Path('app/src/main/java/com/masoud/raja/MainActivity.java')
          s=p.read_text(encoding='utf-8')
          s=s.replace('import android.app.Activity;', '''import android.app.Activity;\nimport android.app.AlertDialog;\nimport android.content.ClipData;\nimport android.content.ClipboardManager;\nimport android.media.Ringtone;\nimport android.media.RingtoneManager;\nimport android.net.Uri;''')
          s=s.replace('    private static final int RED = Color.rgb(255,39,55);', '''    private static final int RED = Color.rgb(255,39,55);\n    private static final String VERSION = "V2";\n    private static final String[] STATIONS = {"تهران","مشهد","اصفهان","شیراز","تبریز","قم","کرمان","اهواز","یزد","رشت","ساری","گرگان","بندرعباس","زاهدان","کرج","قزوین","اراک","همدان","زنجان","کاشان"};\n    private static final String[] REFRESH_PRESETS = {"0.5","1","2","3","5","10"};''')
          s=s.replace('title.setText("MASOUD — ربات رجا");','title.setText("🚆 MASOUD — ربات رجا  •  "+VERSION);')
          s=re.sub(r'LinearLayout trip=section\("تنظیمات اجرای ربات"\);.*?children\.setText\("0"\);', '''LinearLayout trip=section("تنظیمات اجرای ربات"); origin=field("انتخاب مبدا ▼"); destination=field("انتخاب مقصد ▼"); travelDate=field("انتخاب تاریخ شمسی 📅"); trainNumber=field("شماره قطار"); trainNumber.setInputType(InputType.TYPE_CLASS_NUMBER); adults=field("بزرگسال ▼"); adults.setText("1"); children=field("کودک ▼"); children.setText("0");\n        makePickerField(origin); makePickerField(destination); makePickerField(travelDate); makePickerField(adults); makePickerField(children);\n        origin.setOnClickListener(v->showStationPicker(origin,"انتخاب مبدا")); destination.setOnClickListener(v->showStationPicker(destination,"انتخاب مقصد")); travelDate.setOnClickListener(v->showJalaliDatePicker()); adults.setOnClickListener(v->showNumberPicker(adults,"تعداد بزرگسال",1,6)); children.setOnClickListener(v->showNumberPicker(children,"تعداد کودک",0,5));''',s,count=1,flags=re.S)
          s=re.sub(r'LinearLayout live=section\("کنترل زنده"\);.*?gap\(p,8\);', '''LinearLayout live=section("کنترل زنده"); refresh=field("فاصله رفرش (ثانیه) ▼"); refresh.setText("1"); makePickerField(refresh); refresh.setOnClickListener(v->showChoicePicker(refresh,"فاصله رفرش",REFRESH_PRESETS)); LinearLayout refreshRow=new LinearLayout(this); refreshRow.setOrientation(LinearLayout.HORIZONTAL); Button refreshNow=button("↻ رفرش الآن",BLUE); refreshRow.addView(refreshNow,new LinearLayout.LayoutParams(0,dp(48),1)); refreshRow.addView(refresh,new LinearLayout.LayoutParams(0,dp(48),1)); live.addView(refreshRow); refreshNow.setOnClickListener(v->{ if(webView!=null){ log("رفرش دستی"); webView.reload(); showPanel(browserPanel); } }); passengerCountLabel=label("مسافر ذخیره‌شده: 0"); live.addView(passengerCountLabel); p.addView(live); gap(p,8);''',s,count=1,flags=re.S)
          s=s.replace('LinearLayout logs=section("لاگ زنده رجا / ربات"); logView=new TextView(this); logView.setTextColor(TEXT); logView.setTextSize(12); logView.setGravity(Gravity.RIGHT); logView.setTextIsSelectable(true); logView.setMinHeight(dp(160)); logs.addView(logView); p.addView(logs);','LinearLayout logs=section("لاگ زنده رجا / ربات"); Button copyLogs=button("کپی لاگ",BLUE); logs.addView(copyLogs,new LinearLayout.LayoutParams(-1,dp(44))); logView=new TextView(this); logView.setTextColor(TEXT); logView.setTextSize(12); logView.setGravity(Gravity.RIGHT); logView.setTextIsSelectable(true); logView.setMinHeight(dp(160)); logView.setPadding(dp(8),dp(8),dp(8),dp(8)); logs.addView(logView); copyLogs.setOnClickListener(v->copyLogs()); p.addView(logs);')
          helpers='''    private void makePickerField(EditText e){ e.setFocusable(false); e.setCursorVisible(false); e.setLongClickable(false); e.setClickable(true); }\n    private void showStationPicker(EditText target,String title){ showChoicePicker(target,title,STATIONS); }\n    private void showChoicePicker(EditText target,String title,String[] items){ new AlertDialog.Builder(this).setTitle(title).setItems(items,(d,w)->target.setText(items[w])).setNegativeButton("انصراف",null).show(); }\n    private void showNumberPicker(EditText target,String title,int min,int max){ String[] items=new String[max-min+1]; for(int i=0;i<items.length;i++) items[i]=String.valueOf(min+i); showChoicePicker(target,title,items); }\n    private void showJalaliDatePicker(){ LinearLayout box=new LinearLayout(this); box.setOrientation(LinearLayout.HORIZONTAL); box.setPadding(dp(12),dp(8),dp(12),0); box.setGravity(Gravity.CENTER); NumberPicker day=new NumberPicker(this), month=new NumberPicker(this), year=new NumberPicker(this); day.setMinValue(1); day.setMaxValue(31); month.setMinValue(1); month.setMaxValue(12); year.setMinValue(1390); year.setMaxValue(1420); int y=1405,m=6,d=30; try{String[] a=travelDate.getText().toString().split("/"); if(a.length==3){y=Integer.parseInt(a[0]);m=Integer.parseInt(a[1]);d=Integer.parseInt(a[2]);}}catch(Exception ignored){} year.setValue(Math.max(1390,Math.min(1420,y))); month.setValue(Math.max(1,Math.min(12,m))); day.setValue(Math.max(1,Math.min(31,d))); box.addView(day,new LinearLayout.LayoutParams(0,-2,1)); box.addView(month,new LinearLayout.LayoutParams(0,-2,1)); box.addView(year,new LinearLayout.LayoutParams(0,-2,1)); new AlertDialog.Builder(this).setTitle("تقویم شمسی").setView(box).setPositiveButton("انتخاب",(dlg,w)->travelDate.setText(String.format(Locale.US,"%04d/%02d/%02d",year.getValue(),month.getValue(),day.getValue()))).setNegativeButton("انصراف",null).show(); }\n    private void copyLogs(){ ClipboardManager cm=(ClipboardManager)getSystemService(CLIPBOARD_SERVICE); if(cm!=null){ cm.setPrimaryClip(ClipData.newPlainText("MASOUD Raja Logs",logView.getText().toString())); toast("لاگ‌ها کپی شد"); } }\n    private void playAlarm(){ try{ Uri uri=RingtoneManager.getDefaultUri(RingtoneManager.TYPE_ALARM); if(uri==null) uri=RingtoneManager.getDefaultUri(RingtoneManager.TYPE_NOTIFICATION); final Ringtone r=RingtoneManager.getRingtone(this,uri); if(r!=null){ if(android.os.Build.VERSION.SDK_INT>=28) r.setLooping(false); r.play(); handler.postDelayed(()->{try{r.stop();}catch(Exception ignored){}},4000); } }catch(Exception e){ log("خطای آلارم: "+e.getMessage()); } }\n\n'''
          s=s.replace('    private LinearLayout makePassengerPanel(){',helpers+'    private LinearLayout makePassengerPanel(){',1)
          for a,b in [('if(running) handler.postDelayed(()->advanceAutomation(),500);','if(running) handler.postDelayed(()->advanceAutomation(),180);'),('Math.max(0.5,Math.min(60,Double.parseDouble(refresh.getText().toString().trim())))','Math.max(0.3,Math.min(60,Double.parseDouble(refresh.getText().toString().trim())))'),('catch(Exception e){return 2.0;}','catch(Exception e){return 1.0;}'),('handler.postDelayed(this,150);','handler.postDelayed(this,80);'),('fillPassengerPage(); if(alarm.isChecked()) toast("بلیت پیدا شد و رزرو انجام شد"); return;','fillPassengerPage(); showPanel(browserPanel); if(alarm.isChecked()) playAlarm(); return;'),("},900);return 'reserved';","},180);return 'reserved';"),('handler.postDelayed(()->advanceAutomation(),2600);','handler.postDelayed(()->advanceAutomation(),1400);'),('handler.postDelayed(()->advanceAutomation(),1300);','handler.postDelayed(()->advanceAutomation(),450);'),('reserved=true; status.setText("● بلیت پیدا شد؛ رزرو زده شد..."); log("رزرو بلیت کلیک شد.");','reserved=true; status.setText("● بلیت پیدا شد؛ رزرو زده شد..."); log("رزرو بلیت کلیک شد."); showPanel(browserPanel); if(alarm.isChecked()) playAlarm();'),('@JavascriptInterface public void continueClicked(){ runOnUiThread(()->log("ادامه خرید کلیک شد.")); }','@JavascriptInterface public void continueClicked(){ runOnUiThread(()->{ log("ادامه خرید کلیک شد؛ صفحه برای کاربر باز شد."); showPanel(browserPanel); }); }')]: s=s.replace(a,b)
          p.write_text(s,encoding='utf-8')
          manifest=Path('app/src/main/AndroidManifest.xml'); x=manifest.read_text(); x=x.replace('<application android:theme="@style/AppTheme" android:label="MASOUD" android:usesCleartextTraffic="false">','<application android:theme="@style/AppTheme" android:label="MASOUD Raja" android:icon="@drawable/ic_train" android:roundIcon="@drawable/ic_train" android:usesCleartextTraffic="false">'); manifest.write_text(x)
          b=Path('app/build.gradle'); x=b.read_text().replace('versionCode 1','versionCode 2').replace("versionName '1.0.0'","versionName '2.0.0'"); b.write_text(x)
          d=Path('app/src/main/res/drawable'); d.mkdir(parents=True,exist_ok=True); (d/'ic_train.xml').write_text('''<vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="108dp" android:height="108dp" android:viewportWidth="108" android:viewportHeight="108"><path android:fillColor="#0B151E" android:pathData="M0,0h108v108h-108z"/><path android:fillColor="#F4F7FB" android:pathData="M30,18c-7,0 -12,5 -12,12v42c0,8 6,14 14,14l-7,8v4h10l9,-10h20l9,10h10v-4l-7,-8c8,0 14,-6 14,-14V30c0,-7 -5,-12 -12,-12H30zM30,28h48v22H30V28zM31,60a7,7 0,1 1,0 14a7,7 0,0 1,0 -14zM77,60a7,7 0,1 1,0 14a7,7 0,0 1,0 -14z"/><path android:fillColor="#0D7DF5" android:pathData="M38,34h32v10H38z"/></vector>''',encoding='utf-8')
          PYCODE
          python /tmp/patch_v2.py
          grep -q 'private static final String VERSION = "V2"' app/src/main/java/com/masoud/raja/MainActivity.java
          grep -q 'android:icon="@drawable/ic_train"' app/src/main/AndroidManifest.xml

      - name: Build APK
        shell: bash
        run: |
          set -e
          cd buildsrc/MASOUD_Android
          gradle --version
          gradle assembleDebug --stacktrace

      - name: Verify APK
        run: |
          APK=$(find buildsrc -type f -name '*.apk' | head -1)
          test -n "$APK"
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          ls -lh "$APK"
          sha256sum "$APK"

      - name: Collect APK
        run: |
          mkdir -p output
          APK=$(find buildsrc -type f -name '*.apk' | head -1)
          cp "$APK" output/MASOUD_Raja_Android_V2.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MASOUD-Raja-Android-V2-APK
          path: output/MASOUD_Raja_Android_V2.apk
          if-no-files-found: error
