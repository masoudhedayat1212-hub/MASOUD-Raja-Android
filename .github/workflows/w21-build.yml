name: W21 Build

permissions:
  contents: write

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/w21-build.yml'
      - 'w21/MainActivity.java'
      - 'w2/header_parts_v2/**'
      - 'w2/icon_w7_parts/**'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare W21 from W19 reference
        shell: bash
        run: |
          set -euo pipefail
          rm -rf buildsrc output
          unzip -q MASOUD_Android_v1.zip -d buildsrc
          APP=buildsrc/MASOUD_Android
          MAIN="$APP/app/src/main/java/com/masoud/raja/MainActivity.java"
          cp w21/MainActivity.java "$MAIN"

          sed -i 's/import android.app.Ringtone;/import android.media.Ringtone;/' "$MAIN"
          sed -i 's/import android.app.RingtoneManager;/import android.media.RingtoneManager;/' "$MAIN"

          mkdir -p "$APP/app/src/main/res/drawable-nodpi"
          python3 - <<'PY'
          import base64
          from pathlib import Path
          source=''.join(p.read_text(encoding='utf-8') for p in sorted(Path('w2/header_parts_v2').glob('part_*.b64')))
          clean=''.join(ch for ch in source if ch.isalnum() or ch in '+/=')
          clean += '=' * (-len(clean) % 4)
          image=base64.b64decode(clean,validate=False)
          if image[:3] != bytes((255,216,255)):
              raise SystemExit('Invalid header JPEG')
          Path('buildsrc/MASOUD_Android/app/src/main/res/drawable-nodpi/w2_header_reference.jpg').write_bytes(image)
          PY

          python3 - <<'PY'
          import base64
          from pathlib import Path
          source=''.join(p.read_text(encoding='utf-8') for p in sorted(Path('w2/icon_w7_parts').glob('part_*.b64')))
          clean=''.join(ch for ch in source if ch.isalnum() or ch in '+/=')
          clean += '=' * (-len(clean) % 4)
          image=base64.b64decode(clean,validate=False)
          if image[:3] != bytes((255,216,255)):
              raise SystemExit('Invalid icon JPEG')
          Path('buildsrc/MASOUD_Android/app/src/main/res/drawable-nodpi/w12_train_icon_source.jpg').write_bytes(image)
          PY

          python3 -m pip install --quiet pillow
          python3 - <<'PY'
          from PIL import Image, ImageOps
          src=Image.open('buildsrc/MASOUD_Android/app/src/main/res/drawable-nodpi/w12_train_icon_source.jpg').convert('RGB')
          icon=ImageOps.fit(src,(512,512),method=Image.Resampling.LANCZOS,centering=(0.43,0.5))
          icon.save('buildsrc/MASOUD_Android/app/src/main/res/drawable-nodpi/w12_train_icon.png',optimize=True)
          PY

          python3 - <<'PY'
          import re
          from pathlib import Path
          p=Path('buildsrc/MASOUD_Android/app/src/main/AndroidManifest.xml')
          t=p.read_text(encoding='utf-8')
          t=re.sub(r'\s+android:icon="[^"]*"','',t)
          t=re.sub(r'\s+android:roundIcon="[^"]*"','',t)
          t=t.replace('<application','<application android:icon="@drawable/w12_train_icon" android:roundIcon="@drawable/w12_train_icon"',1)
          p.write_text(t,encoding='utf-8')
          PY

          python3 - <<'PY'
          from pathlib import Path
          p=Path('buildsrc/MASOUD_Android/app/build.gradle')
          t=p.read_text(encoding='utf-8')
          t=t.replace("applicationId 'com.masoud.raja'","applicationId 'com.masoud.raja.w21'")
          t=t.replace('applicationId "com.masoud.raja"','applicationId "com.masoud.raja.w21"')
          t=t.replace('versionCode 1','versionCode 52')
          t=t.replace("versionName '1.0.0'","versionName 'W21'")
          t=t.replace('versionName "1.0.0"','versionName "W21"')
          p.write_text(t,encoding='utf-8')
          PY

      - name: Verify W19 baseline preserved and W21 fixes present
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'version.setText("W21")' w21/MainActivity.java
          grep -q 'new WebView(this)' w21/MainActivity.java
          grep -q 'injectLogin()' w21/MainActivity.java
          grep -q 'inspectResultsAndReserve()' w21/MainActivity.java
          grep -q 'W21: مبدا تأیید شد' w21/MainActivity.java
          grep -q 'W21: مقصد تأیید شد' w21/MainActivity.java
          grep -q 'W21: تاریخ تأیید شد' w21/MainActivity.java
          grep -q 'W21: تعداد مسافران تأیید شد' w21/MainActivity.java
          grep -q "app-stations,ng-select" w21/MainActivity.java
          grep -q "inputFor(kind)" w21/MainActivity.java
          grep -q "setPassengerCounts" w21/MainActivity.java
          grep -q "pressSearch" w21/MainActivity.java
          grep -q 'webView.reload()' w21/MainActivity.java
          grep -q "applicationId 'com.masoud.raja.w21'" buildsrc/MASOUD_Android/app/build.gradle || grep -q 'applicationId "com.masoud.raja.w21"' buildsrc/MASOUD_Android/app/build.gradle
          grep -q 'versionCode 52' buildsrc/MASOUD_Android/app/build.gradle

      - name: Check inherited W19 regression scenarios
        run: |
          npm install --prefix /tmp/raja-w21-test jsdom@26.1.0 --no-audit --no-fund
          NODE_PATH=/tmp/raja-w21-test/node_modules node w19/test.js

      - name: Build APK
        shell: bash
        run: |
          set -euo pipefail
          cd buildsrc/MASOUD_Android
          gradle assembleDebug --stacktrace

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          APK=$(find buildsrc/MASOUD_Android/app/build/outputs/apk -type f -name '*.apk' | head -1)
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          mkdir -p "$GITHUB_WORKSPACE/output"
          cp "$APK" "$GITHUB_WORKSPACE/output/w21.apk"

      - name: Save W21 APK in repository
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p releases
          cp output/w21.apk releases/MASOUD_Raja_W21.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f releases/MASOUD_Raja_W21.apk
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Save installable W21 APK"
          git push

      - uses: actions/upload-artifact@v4
        with:
          name: w21
          path: output/w21.apk
          if-no-files-found: error
